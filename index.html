<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Personal Media Streaming Web Client">
  <title>Anime Stream</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e50914'><polygon points='5 3 19 12 5 21 5 3'/></svg>">

  <!-- Modular CSS Architecture -->
  <link rel="stylesheet" href="./styles/variables.css?v=1795383278">
  <link rel="stylesheet" href="./styles/layout.css?v=1795383278">
  <link rel="stylesheet" href="./styles/components.css?v=1795383278">
</head>
<body>

  <!-- Clean Minimalist Header -->
  <header>
    <div class="header-left">
      <button id="nav-catalog-btn" class="header-brand-btn" title="Ir al catÃƒÂ¡logo principal de series">
        <span class="brand-accent">ANIME</span>
        <span class="header-divider">|</span>
        <span class="header-category">Series</span>
      </button>
    </div>
    <div class="header-right">
      <button id="back-to-catalog-btn" class="header-back-btn hidden" title="Volver a la selecciÃƒÂ³n de series">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>CatÃƒÂ¡logo</span>
      </button>
      <div class="header-meta" id="catalog-count">Cargando...</div>
    </div>
  </header>

  <main>
    <!-- VIEW 1: SERIES SHOWCASE (Ultra HD Vertical Posters Grid 2:3) -->
    <section id="series-showcase-view" class="series-showcase-view" aria-label="CatÃƒÂ¡logo de series">
      <div class="showcase-header">
        <div class="showcase-title-wrap">
          <span class="netflix-red-bar"></span>
          <h2 class="showcase-title">CatÃƒÂ¡logo de Series</h2>
        </div>
        <p class="showcase-subtitle">Elige una serie para ver sus episodios disponibles.</p>
      </div>

      <div class="series-posters-grid" id="series-posters-grid">
        <div class="empty-state">Cargando catÃƒÂ¡logo...</div>
      </div>
    </section>

    <!-- VIEW 2: SERIES PLAYER & NETFLIX EPISODE LIST -->
    <section id="series-detail-view" class="series-detail-view hidden" aria-label="Reproductor y capÃƒÂ­tulos">
      <!-- Cinema Video Player -->
      <section class="player-container" aria-label="Reproductor principal">
        <div class="video-aspect-ratio">
          <video id="media-player" controls playsinline preload="auto">
            <p>Tu navegador no soporta el reproductor de video HTML5.</p>
          </video>

          <!-- Buffering / Loading State Overlay -->
          <div id="player-loader" class="player-loader hidden" aria-live="polite">
            <div class="loader-spinner"></div>
          </div>

          <!-- Error State Overlay -->
          <div id="player-error" class="player-error hidden" role="alert">
            <p class="player-error-text">No se pudo conectar al video.</p>
            <button id="player-retry-btn" class="action-btn">Reintentar</button>
          </div>
        </div>

        <!-- Now Playing Metadata Bar -->
        <div class="now-playing-panel">
          <div class="now-playing-info">
            <h1 class="now-playing-title" id="now-title">Cargando contenido...</h1>
            <div class="now-playing-subtitle" id="now-subtitle">LibrerÃƒÂ­a multimedia</div>
          </div>
          <a id="download-btn" href="#" download class="action-btn" title="Descargar archivo para ver sin conexiÃƒÂ³n">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>Descargar</span>
          </a>
        </div>
      </section>

      <!-- Episode List (Netflix Style Rows with Thumbnails) -->
      <section class="episodes-section" aria-label="Lista de episodios">
        <div class="episodes-header">
          <div class="episodes-header-left">
            <span class="episodes-bullet"></span>
            <h3 class="current-series-name" id="current-series-name">Episodios</h3>
            <span class="current-series-badge" id="current-series-badge"></span>
          </div>
        </div>

        <!-- Clean Netflix Episode Rows List -->
        <div class="episodes-list" id="catalog-list">
          <div class="empty-state">Cargando episodios...</div>
        </div>
      </section>
    </section>
  </main>

  <!-- ES6 Module Entrypoint -->
  <script type="module" src="./src/app.js?v=1795383278"></script>
</body>
</html>
